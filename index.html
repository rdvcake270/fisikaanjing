    <script>

        const subMedia = {

            'teacher-explanation-tengah': { type: 'audio', src: "Assets/audio-hidrostatis.mp3" } // Ganti dengan link audio MP3 Anda
        };

const quizData = [
    { 
        type: "mcq", 
        question: "Prinsip kerja rem hidrolik pada mobil memanfaatkan hukum fisika...", 
        options: ["Hukum Archimedes", "Hukum Pascal", "Hukum Boyles", "Hukum Bernoulli"], 
        answer: 1 
    },
    { 
        type: "tf", 
        question: "Tekanan hidrostatis tidak dipengaruhi oleh massa jenis zat cair, melainkan hanya dipengaruhi oleh kedalaman.", 
        options: ["Benar", "Salah"], 
        answer: 1 
    },
    { 
        type: "mcq", 
        question: "Minyak goreng berada dalam wadah setinggi 2 meter (massa jenis minyak = 800 kg/m³). Jika g = 10 m/s², berapakah tekanan hidrostatis pada dasar wadah?<br><small><b>Rumus: P<sub>h</sub> = ρ × g × h</b></small>", 
        options: [
            "1.600 Pa", 
            "8.000 Pa", 
            "16.000 Pa", 
            "160.000 Pa"
        ], 
        answer: 2 // Jawaban: C (16.000 Pa)
    },
    { 
        type: "mcq", 
        question: "Suatu benda mengapung di atas air karena gaya apung (F<sub>a</sub>) yang bekerja pada benda tersebut...", 
        options: [
            "Lebih kecil dari berat benda", 
            "Sama dengan berat benda", 
            "Sama dengan nol", 
            "Tidak berhubungan dengan berat benda"
        ], 
        answer: 1 
    },
    { 
        type: "tf", 
        question: "Silet atau klip kertas dapat mengapung di permukaan air yang tenang akibat adanya fenomena tegangan permukaan.", 
        options: ["Benar", "Salah"], 
        answer: 0 
    },
    { 
        type: "dragdrop", 
        question: "Setiap benda yang dicelupkan sebagian atau seluruhnya ke dalam zat cair akan mengalami gaya ke atas yang besarnya sama dengan berat zat cair yang dipindahkan. Ini adalah bunyi hukum!", 
        words: ["Pascal", "Archimedes", "Bernoulli"], 
        answer: "Archimedes" 
    },
    { 
        type: "short", 
        question: "Gaya ke atas yang dialami benda di dalam fluida sering juga disebut sebagai gaya...", 
        answer: "apung" 
    },
    { 
        type: "matching", 
        question: "Pasangkan fenomena fluida berikut dengan penyebab atau hukum yang mendasarinya!", 
        pairs: [
            { label: "Batu tenggelam di air", options: ["Tegangan Permukaan", "Massa jenis benda > massa jenis air"], answer: "Massa jenis benda > massa jenis air" }, 
            { label: "Serangga berjalan di air", options: ["Tegangan Permukaan", "Massa jenis benda > massa jenis air"], answer: "Tegangan Permukaan" }
        ] 
    },
    { 
        type: "mcq", 
        question: "Sebuah pompa hidrolik memiliki luas penampang A<sub>1</sub> = 5 cm² dan A<sub>2</sub> = 50 cm². Jika gaya tekan sebesar 50 N diberikan pada penampang kecil, berapa beban maksimum F<sub>2</sub> yang dapat diangkat pada penampang besar?<br><small><b>Rumus: F<sub>1</sub> / A<sub>1</sub> = F<sub>2</sub> / A<sub>2</sub></b></small>", 
        options: [
            "250 N", 
            "500 N", 
            "1.000 N", 
            "2.500 N"
        ], 
        answer: 1 // Jawaban: B (500 N)
    },
    { 
        type: "tf", 
        question: "Madu memiliki nilai viskositas yang lebih tinggi dibandingkan dengan air murni.", 
        options: ["Benar", "Salah"], 
        answer: 0 
    }
];

        let studentData = { name: "", class: "" };
        let currentQuestion = 0;
        let score = 0;
        let draggedValue = "";

        // VARIABEL PENGATUR TIMER
        const TIME_LIMIT_PER_QUESTION = 120; // 30 Detik per soal
        let timeLeft = TIME_LIMIT_PER_QUESTION;
        let timerInterval = null;

        // FUNGSI BARU UNTUK AUDIO GURU
        function playTeacherExplanation() {
            const teacherAudio = document.getElementById('teacher-explanation');
            const mediaSource = subMedia['teacher-explanation'].src;
            
            // Hentikan musik latar jika sedang diputar agar tidak tabrakan
            const bgMusic = document.getElementById('bg-music');
            if (isPlaying) {
                bgMusic.pause();
                document.getElementById('audio-label').innerText = "Musik: OFF";
                isPlaying = false;
            }

            // Set sumber audio dan putar
            if (mediaSource) {
                teacherAudio.src = mediaSource;
                teacherAudio.play().catch(() => { alert("Gagal memutar audio penjelasan. Periksa tautan sumber."); });
            } else {
                alert("Tautan audio penjelasan belum diset.");
            }
        }
        function playAudioGuru() {
        // Ambil elemen audionya
        var audioElement = document.getElementById('teacher-explanation');
    
        // Tentukan sumber audionya di sini
      audioElement.src = 'penjelasan_guru.mp3'; // <--- PASTIKAN INI ADA
    
    // Putar audionya
    audioElement.play();
}
        // FUNGSI BARU UNTUK BUKA VIDEO MODAL
        function openVideoModal() {
            hideAllViewers();
            const videoViewer = document.getElementById('videoViewer');
            const videoPlayer = document.getElementById('mainVideoPlayer');
            const videoSource = subMedia['video-intro'].src;

            // Hentikan musik latar
            const bgMusic = document.getElementById('bg-music');
            if (isPlaying) {
                bgMusic.pause();
                document.getElementById('audio-label').innerText = "Musik: OFF";
                isPlaying = false;
            }
        
            if (videoSource) {
                videoPlayer.src = videoSource;
                videoViewer.style.display = "block";
                document.getElementById('mediaModal').style.display = 'flex';
                videoPlayer.play();
            } else {
                alert("Tautan video belum diset.");
            }
        }

        function openSubInfographic(id) {
            hideAllViewers();
            const media = subMedia[id];
            if (!media) return;

            if (media.type === 'sim') {
                const simViewer = document.getElementById('subSimViewer');
                simViewer.src = media.src;
                simViewer.style.display = "block";
            } else if (media.type === 'img') {
                const imgViewer = document.getElementById('subImgViewer');
                imgViewer.src = media.src;
                imgViewer.style.display = "block";
            }
            document.getElementById('mediaModal').style.display = 'flex';
        }

        // FUNGSI HELPER UNTUK SEMBUNYIKAN SEMUA VIEWER MODAL
        function hideAllViewers() {
            document.getElementById('subSimViewer').style.display = "none";
            document.getElementById('subImgViewer').style.display = "none";
            document.getElementById('videoViewer').style.display = "none";
            document.getElementById('subSimViewer').src = ""; // Stop iframe loading
            document.getElementById('mainVideoPlayer').pause(); // Stop video
        }

        function closeMediaModal() {
            hideAllViewers();
            document.getElementById('mediaModal').style.display = 'none';
        }

        function openQuizModal() {
            document.getElementById('quizModal').style.display = 'flex';
            if (!studentData.name) {
                showQuizSection('login');
            } else {
                showQuizSection('question');
                renderQuestion();
            }
        }

        function closeQuizModal() {
            stopTimer();
            document.getElementById('quizModal').style.display = 'none';
        }

        function showQuizSection(sectionName) {
            document.getElementById('section-login').style.display = (sectionName === 'login') ? 'block' : 'none';
            document.getElementById('section-question').style.display = (sectionName === 'question') ? 'block' : 'none';
            document.getElementById('section-result').style.display = (sectionName === 'result') ? 'block' : 'none';
        }

        function handleLogin(e) {
            e.preventDefault();
            studentData.name = document.getElementById('studentName').value;
            studentData.class = document.getElementById('studentClass').value;
            currentQuestion = 0;
            score = 0;
            showQuizSection('question');
            renderQuestion();
        }

        // FUNGSIONALITAS TIMER HUKUM HITUNG MUNDUR
        function startTimer() {
            stopTimer(); // Hentikan timer sebelumnya jika ada
            timeLeft = TIME_LIMIT_PER_QUESTION;
            updateTimerUI();

            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerUI();

                // Jika waktu habis, anggap salah & lanjut ke soal berikutnya
                if (timeLeft <= 0) {
                    stopTimer();
                    checkAnswer(false); 
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
        }

        function updateTimerUI() {
            document.getElementById('timer-counter').innerText = `${timeLeft}s`;
            const percentage = (timeLeft / TIME_LIMIT_PER_QUESTION) * 100;
            document.getElementById('timer-progress').style.width = `${percentage}%`;
        }

        function renderQuestion() {
            if (currentQuestion < quizData.length) {
                const q = quizData[currentQuestion];
                
                document.getElementById('display-student-info').innerText = `${studentData.name} (${studentData.class})`;
                document.getElementById('display-question-text').innerHTML = `Soal ${currentQuestion + 1}/${quizData.length}:<br>${q.question}`;
                
                const container = document.getElementById('display-interactive-area');
                const submitBtn = document.getElementById('btn-submit-answer');
                container.innerHTML = '';
                submitBtn.style.display = 'none';

                // Jalankan Timer Setiap Soal Baru Muncul
                startTimer();

                if (q.type === 'mcq' || q.type === 'tf') {
                    q.options.forEach((opt, idx) => {
                        const btn = document.createElement('button');
                        btn.className = 'option-btn';
                        btn.innerHTML = opt;
                        btn.onclick = () => checkAnswer(idx);
                        container.appendChild(btn);
                    });
                } else if (q.type === 'short') {
                    container.innerHTML = `<input type="text" id="short-answer-input" placeholder="Ketik jawaban Anda..." style="width:100%; padding:12px; border-radius:8px; border:1px solid #334155; background:#0f172a; color:white; outline:none; margin-top:10px;">`;
                    submitBtn.style.display = 'block';
                    submitBtn.onclick = () => {
                        const userAns = document.getElementById('short-answer-input').value.trim().toLowerCase();
                        checkAnswer(userAns === q.answer.toLowerCase() ? true : false);
                    };
                } else if (q.type === 'dragdrop') {
                    let dragHTML = `<div class="drag-container">`;
                    q.words.forEach(w => { dragHTML += `<div class="draggable" draggable="true" ondragstart="drag(event)" id="drag-${w}">${w}</div>`; });
                    dragHTML += `</div><div class="drop-target" ondrop="drop(event)" ondragover="allowDrop(event)" id="drop-box">Drop kata di sini</div>`;
                    container.innerHTML = dragHTML;

                    submitBtn.style.display = 'block';
                    submitBtn.onclick = () => {
                        const droppedText = document.getElementById('drop-box').innerText;
                        checkAnswer(droppedText === q.answer ? true : false);
                    };
                } else if (q.type === 'matching') {
                    let matchHTML = '';
                    q.pairs.forEach((p, idx) => {
                        matchHTML += `<div class="match-row"><span class="match-label">${p.label}</span><select class="match-select" id="match-sel-${idx}"><option value="">--Pilih--</option>${p.options.map(o => `<option value="${o}">${o}</option>`).join('')}</select></div>`;
                    });
                    container.innerHTML = matchHTML;

                    submitBtn.style.display = 'block';
                    submitBtn.onclick = () => {
                        let allCorrect = true;
                        q.pairs.forEach((p, idx) => {
                            if (document.getElementById(`match-sel-${idx}`).value !== p.answer) allCorrect = false;
                        });
                        checkAnswer(allCorrect ? true : false);
                    };
                }
            } else {
                stopTimer();
                renderResult();
            }
        }

        function allowDrop(ev) { ev.preventDefault(); }
        function drag(ev) { draggedValue = ev.target.innerText; }
        function drop(ev) {
            ev.preventDefault();
            ev.target.innerText = draggedValue;
            ev.target.style.borderColor = '#22c55e';
        }

        function checkAnswer(isCorrectOrIndex) {
            stopTimer(); // Matikan timer begitu siswa menjawab
            const q = quizData[currentQuestion];

            if (q.type === 'mcq' || q.type === 'tf') {
                if (isCorrectOrIndex === q.answer) score++;
            } else {
                if (isCorrectOrIndex === true) score++;
            }
            
            currentQuestion++;
            renderQuestion();
        }

        function renderResult() {
            showQuizSection('result');
            document.getElementById('result-name').innerText = studentData.name;
            document.getElementById('result-class').innerText = studentData.class;
            
            const finalScore = (score / quizData.length) * 100;
            document.getElementById('result-score').innerText = Math.round(finalScore);
        }

        function resetQuiz() {
            currentQuestion = 0;
            score = 0;
            showQuizSection('question');
            renderQuestion();
        }

        let isPlaying = true;
        function toggleAudio() {
            const music = document.getElementById('bg-music');
            const label = document.getElementById('audio-label');
            
            // Hentikan audio penjelasan guru jika sedang diputar
            document.getElementById('teacher-explanation').pause();

            if (isPlaying) {
                music.pause();
                label.innerText = "Musik: OFF";
                isPlaying = false;
            } else {
                music.play().then(() => {
                    label.innerText = "Musik: ON";
                    isPlaying = true;
                }).catch(() => { alert("Gagal memutar lagu!"); });
            }
        }
    </script>
